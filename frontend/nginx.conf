server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers at server level so EVERY response (HTML, JS, CSS, fonts) carries them (RV-14).
  # No add_header inside locations: in nginx that would silently drop these inherited headers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # ADR-0004: same-origin API — the browser never talks to Strapi directly and needs no token.
  # Only GET/HEAD are forwarded: the public surface is read-only by construction.
  location /api/ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://strapi:1337/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";
  }

  # hashed bundles → long cache (expires sets Cache-Control without add_header)
  location ~* \.(?:js|css|woff2)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1; # Cache-Control: no-cache for index.html
    try_files $uri $uri/ /index.html;
  }
}
